server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: search-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/crime-platform}
  datasource:
    url: jdbc:postgresql://localhost:5432/crime_analytics
    username: crime_admin
    password: ${SPRING_DATASOURCE_PASSWORD:CrimeSecure2024!}
    driver-class-name: org.postgresql.Driver
  elasticsearch:
    uris: http://localhost:9200
    socket-timeout: 30s
    connection-timeout: 5s

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: search-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
