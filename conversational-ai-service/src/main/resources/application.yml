server:
  port: 8087
  shutdown: graceful

spring:
  application:
    name: conversational-ai-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/crime-platform}
  datasource:
    url: jdbc:postgresql://localhost:5432/crime_analytics
    username: crime_admin
    password: ${SPRING_DATASOURCE_PASSWORD:CrimeSecure2024!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

logging:
  level:
    gov.lawenforcement.conversational: INFO

management:
  tracing:
    enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: conversational-ai-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
